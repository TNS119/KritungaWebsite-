name: Kritunga Palegar Production CI/CD & Heartbeat

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Free 12-minute keep-alive heartbeat to prevent free-tier backend cold starts
    - cron: '*/12 * * * *'

jobs:
  validate-and-build:
    name: Build & Typecheck Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Build Backend (TypeScript Compilation)
        run: npm run build --workspace=backend

      - name: Build Frontend (Next.js Optimization)
        run: npm run build --workspace=frontend

  keep-alive-heartbeat:
    name: Production Backend Keep-Alive
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Ping Live Backend Endpoint
        run: |
          if [ -n "${{ secrets.PRODUCTION_BACKEND_URL }}" ]; then
            echo "Pinging ${{ secrets.PRODUCTION_BACKEND_URL }}/api/health..."
            curl -s -f "${{ secrets.PRODUCTION_BACKEND_URL }}/api/health" || echo "Heartbeat ping completed."
          else
            echo "PRODUCTION_BACKEND_URL secret not yet configured. Skipping ping."
          fi
